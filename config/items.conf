# 条目表：id|分组|名称|描述|默认勾选(1/0)|动作
# 加软件 = 加一行。动作见 lib/actions.sh：
#   apt[:包名]   apt 安装（包名缺省=id）
#   upgrade      apt update && upgrade
#   zshrc:内容   写入 ~/.zshrc 受管块（内容=该行透传）
#   gitcfg/docker_engine/docker_plugin/docker_group/chsh  自定义动作
# 注意：字段里不要出现 | 和 ,

# ── system ──
apt-upgrade|system|apt 升级|整体升级软件包|1|upgrade

# ── base ──
build-essential|base|build-essential|gcc/g++ 编译工具链|1|apt
git|base|git|版本控制|1|apt
curl|base|curl|下载/请求工具|1|apt
wget|base|wget|下载工具|1|apt
tmux|base|tmux|终端复用|1|apt
htop|base|htop|进程监视|1|apt
jq|base|jq|JSON 处理|1|apt
vim|base|vim|编辑器|1|apt
net-tools|base|net-tools|ifconfig/ping|1|apt
unzip|base|unzip|解压|1|apt
tldr|base|tldr|命令速查|1|apt
ufw|base|ufw|防火墙|1|apt

# ── zsh ──
zsh|zsh|zsh|Zsh 本体|1|apt
zsh-antigen|zsh|zsh-antigen|插件管理器|1|apt
oh-my-zsh|zsh|oh-my-zsh|框架（antigen 拉取）|1|zshrc:antigen use oh-my-zsh
bundle-git|zsh|插件 git|git 别名|1|zshrc:antigen bundle git
bundle-wd|zsh|插件 wd|快速跳目录|1|zshrc:antigen bundle wd
bundle-aliases|zsh|插件 aliases|别名总集|1|zshrc:antigen bundle aliases
bundle-common|zsh|插件 common-aliases|常用别名|1|zshrc:antigen bundle common-aliases
bundle-tmux|zsh|插件 tmux|tmux 集成|1|zshrc:antigen bundle tmux
bundle-syntax|zsh|插件 syntax-highlighting|命令高亮|1|zshrc:antigen bundle zsh-users/zsh-syntax-highlighting
bundle-auto|zsh|插件 autosuggestions|自动建议|1|zshrc:antigen bundle zsh-users/zsh-autosuggestions
theme-af-magic|zsh|主题 af-magic|主题|1|zshrc:antigen theme af-magic
chsh|zsh|chsh 默认 shell|改为 zsh|1|chsh

# ── git ──
git-config|git|全局配置|名字/邮箱/默认分支|1|gitcfg

# ── docker ──
docker-ce|docker|docker-ce|引擎本体|0|docker_engine
docker-compose|docker|compose-plugin|compose v2|0|docker_plugin
docker-buildx|docker|buildx-plugin|构建加速|0|docker_plugin
docker-group|docker|加入 docker 组|免 sudo|0|docker_group
